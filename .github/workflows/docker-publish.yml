name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version (e.g. 1.2.0)"
        required: true
      push_latest:
        description: "Also push :latest tag"
        required: false
        default: "true"
  pull_request:
    types: [labeled]

jobs:
  publish:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'publish-preview')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Determine image tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "tag=pr$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "push_latest=$INPUT_PUSH_LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --build-arg VERSION="$TAG" \
            -t "spidermila/wsdownloader:$TAG" \
            .
          docker push "spidermila/wsdownloader:$TAG"

      - name: Tag and push latest
        if: steps.meta.outputs.push_latest == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker tag "spidermila/wsdownloader:$TAG" spidermila/wsdownloader:latest
          docker push spidermila/wsdownloader:latest
