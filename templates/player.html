<!DOCTYPE html>
<html lang="cs" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ filename }} — Přehrávač</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
    }
    .player-wrapper {
      max-width: 1280px;
      margin: 0 auto;
    }
    #video-container {
      position: relative;
      line-height: 0; /* remove gap below video */
    }
    video {
      width: 100%;
      max-height: 72vh;
      background: #000;
      display: block;
    }
    #subtitle-display {
      position: absolute;
      bottom: 3.2rem; /* above native controls */
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      padding: 0 1.5rem;
      line-height: normal;
      z-index: 10;
    }
    #subtitle-display span {
      display: inline-block;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 1.1rem;
      padding: 0.15rem 0.55rem;
      border-radius: 3px;
      white-space: pre-wrap;
    }
    /* Fullscreen: keep overlay inside the container */
    #video-container:fullscreen video { max-height: 100vh; }
    #video-container:-webkit-full-screen video { max-height: 100vh; }
    .track-section label {
      font-size: 0.875rem;
    }
    .back-link {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="player-wrapper px-2 px-md-4 py-3">

    <div class="d-flex align-items-center gap-3 mb-3">
      <a href="/" class="btn btn-sm btn-outline-secondary back-link">&larr; Zpět</a>
      <h1 class="h5 mb-0 text-truncate" title="{{ filename }}">{{ filename }}</h1>
    </div>

    <div id="video-container">
      <video id="player" controls preload="metadata">
        <source id="video-source" src="{{ url_for('stream_file', filename=filename) }}" />
        Váš prohlížeč nepodporuje přehrávání videa.
      </video>
      <div id="subtitle-display"><span id="subtitle-text" style="display:none;"></span></div>
    </div>

    <div class="mt-3 track-section" id="track-controls" style="display:none !important;">
      <div class="row g-3">
        <div class="col-12 col-sm-auto" id="audio-track-wrapper" style="display:none;">
          <label for="audio-track-select" class="form-label mb-1">Zvuková stopa</label>
          <select id="audio-track-select" class="form-select form-select-sm" style="min-width:180px;"></select>
        </div>
        <div class="col-12 col-sm-auto" id="subtitle-track-wrapper" style="display:none;">
          <label for="subtitle-track-select" class="form-label mb-1">Titulky</label>
          <select id="subtitle-track-select" class="form-select form-select-sm" style="min-width:180px;"></select>
          <div id="subtitle-debug" class="text-muted small mt-1" style="display:none;"></div>
        </div>
        <div class="col-12 col-sm-auto d-flex align-items-end" id="transcode-notice" style="display:none !important;">
          <span class="text-warning small">
            <span class="spinner-border spinner-border-sm me-1" role="status" id="transcode-spinner" style="display:none;"></span>
            <span id="transcode-msg"></span>
          </span>
        </div>
      </div>
    </div>

    <p class="text-muted small mt-3 mb-0">
      Tip: Klávesu <kbd>F</kbd> pro fullscreen, <kbd>Mezerník</kbd> pro pauzu, šipky <kbd>←</kbd>/<kbd>→</kbd> pro skok o 5 s.
    </p>
  </div>

  <script>
    const video = document.getElementById('player');
    const videoSource = document.getElementById('video-source');
    const videoContainer = document.getElementById('video-container');
    const subtitleText = document.getElementById('subtitle-text');
    const trackControls = document.getElementById('track-controls');
    const audioWrapper = document.getElementById('audio-track-wrapper');
    const audioSelect = document.getElementById('audio-track-select');
    const subtitleWrapper = document.getElementById('subtitle-track-wrapper');
    const subtitleSelect = document.getElementById('subtitle-track-select');
    const transcodeNotice = document.getElementById('transcode-notice');
    const transcodeSpinner = document.getElementById('transcode-spinner');
    const transcodeMsg = document.getElementById('transcode-msg');

    const filename = {{ filename | tojson }};
    const directUrl = {{ url_for('stream_file', filename=filename) | tojson }};
    const subtitleBaseUrl = {{ url_for('subtitle_track', filename=filename) | tojson }};
    const streamTrackBaseUrl = {{ url_for('stream_track', filename=filename) | tojson }};

    let selectedAudioIndex = null;
    let selectedSubtitleIndex = -1;
    let audioTracks = [];
    let subtitleTracks = [];
    let streamLoading = false;
    let subtitleCues = []; // [{start, end, text}]

    const subtitleDebug = document.getElementById('subtitle-debug');

    function setSubtitleDebug(msg) {
      subtitleDebug.textContent = msg;
      subtitleDebug.style.display = msg ? '' : 'none';
    }
    // Custom <div> overlay driven by timeupdate — avoids all browser <track> quirks.

    function vttTimeToSeconds(s) {
      const m = s.match(/^(?:(\d+):)?(\d{2}):(\d{2}[.,]\d+)$/);
      if (!m) return NaN;
      return (parseInt(m[1] || 0, 10) * 3600)
        + (parseInt(m[2], 10) * 60)
        + parseFloat(m[3].replace(',', '.'));
    }

    function parseVTT(text) {
      const cues = [];
      const blocks = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\n+/);
      for (const block of blocks) {
        const lines = block.trim().split('\n');
        if (!lines.length) continue;
        const first = lines[0];
        if (first.startsWith('WEBVTT') || first.startsWith('NOTE')
            || first.startsWith('STYLE') || first.startsWith('REGION')) continue;

        let i = 0;
        if (!lines[i].includes('-->')) i++; // skip optional cue id
        if (i >= lines.length || !lines[i].includes('-->')) continue;

        const m = lines[i].match(/^(\S+)\s+-->\s+(\S+)/);
        if (!m) continue;
        const start = vttTimeToSeconds(m[1]);
        const end = vttTimeToSeconds(m[2]);
        if (isNaN(start) || isNaN(end)) continue;

        // Strip WebVTT/HTML tags for plain-text display
        const cueText = lines.slice(i + 1).join('\n').trim()
          .replace(/<[^>]+>/g, '');
        if (cueText) cues.push({ start, end, text: cueText });
      }
      return cues;
    }

    function updateSubtitleOverlay() {
      const t = video.currentTime;
      const active = subtitleCues.find(c => t >= c.start && t < c.end);
      if (active) {
        subtitleText.textContent = active.text;
        subtitleText.style.display = '';
      } else {
        subtitleText.style.display = 'none';
      }
    }

    video.addEventListener('timeupdate', updateSubtitleOverlay);

    async function applySubtitle(index) {
      subtitleCues = [];
      subtitleText.style.display = 'none';
      setSubtitleDebug('');
      if (index < 0) return;

      const url = `${subtitleBaseUrl}?index=${index}`;
      console.log('[subtitles] Fetching:', url);
      try {
        const res = await fetch(url);
        console.log('[subtitles] Response status:', res.status, res.statusText);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        console.log('[subtitles] VTT text length:', text.length);
        console.log('[subtitles] VTT preview:', text.slice(0, 200));
        subtitleCues = parseVTT(text);
        console.log('[subtitles] Parsed cues:', subtitleCues.length, subtitleCues.slice(0, 3));
        setSubtitleDebug(`${subtitleCues.length} titulků načteno`);
        updateSubtitleOverlay();
      } catch (err) {
        console.error('[subtitles] Failed to load subtitle:', err);
        setSubtitleDebug(`Chyba: ${err.message}`);
      }
    }

    // ── Transcoded stream (non-default audio) ───────────────────────────────────

    function setTranscodeStatus(active) {
      if (active) {
        transcodeNotice.style.removeProperty('display');
        transcodeSpinner.style.display = '';
        transcodeMsg.textContent = 'Překódovávám audio stopy…';
      } else {
        transcodeNotice.style.setProperty('display', 'none', 'important');
        transcodeSpinner.style.display = 'none';
        transcodeMsg.textContent = '';
      }
    }

    function needsTranscode() {
      const defaultAudio = audioTracks.length > 0 ? audioTracks[0].index : null;
      return selectedAudioIndex !== null && selectedAudioIndex !== defaultAudio;
    }

    function loadTranscoded(startTime, resumePlay) {
      if (streamLoading) return;
      streamLoading = true;
      const savedSubtitleIndex = selectedSubtitleIndex;

      setTranscodeStatus(true);
      videoSource.src = `${streamTrackBaseUrl}`
        + `?audio=${selectedAudioIndex ?? audioTracks[0].index}&t=${startTime}`;
      video.load();

      video.addEventListener('loadedmetadata', function onLoaded() {
        video.removeEventListener('loadedmetadata', onLoaded);
        streamLoading = false;
        if (resumePlay) video.play().catch(() => {});
        applySubtitle(savedSubtitleIndex);
      });
    }

    function reloadWithTracks() {
      const savedTime = video.currentTime;
      const wasPlaying = !video.paused;
      const savedSubtitleIndex = selectedSubtitleIndex;

      if (needsTranscode()) {
        loadTranscoded(savedTime, wasPlaying);
      } else {
        setTranscodeStatus(false);
        videoSource.src = directUrl;
        video.load();
        video.addEventListener('loadedmetadata', function onLoaded() {
          video.removeEventListener('loadedmetadata', onLoaded);
          video.currentTime = savedTime;
          if (wasPlaying) video.play().catch(() => {});
          applySubtitle(savedSubtitleIndex);
        });
      }
    }

    // Intercept out-of-buffer seeks on transcoded streams (no range support on pipe).
    video.addEventListener('seeking', () => {
      if (!needsTranscode() || streamLoading) return;

      const targetTime = video.currentTime;
      for (let i = 0; i < video.buffered.length; i++) {
        if (video.buffered.start(i) <= targetTime && targetTime <= video.buffered.end(i)) {
          return;
        }
      }
      loadTranscoded(targetTime, !video.paused);
    });

    // ── Track info ──────────────────────────────────────────────────────────────

    fetch(`/file-info/${encodeURIComponent(filename)}`)
      .then(r => r.json())
      .then(info => {
        audioTracks = info.audio_tracks || [];
        subtitleTracks = info.subtitle_tracks || [];

        let hasControls = false;

        if (audioTracks.length > 1) {
          hasControls = true;
          audioWrapper.style.display = '';
          selectedAudioIndex = audioTracks[0].index;

          audioTracks.forEach((t, i) => {
            const opt = document.createElement('option');
            opt.value = t.index;
            opt.textContent = t.label;
            if (i === 0) opt.selected = true;
            audioSelect.appendChild(opt);
          });

          audioSelect.addEventListener('change', () => {
            selectedAudioIndex = parseInt(audioSelect.value);
            reloadWithTracks();
          });
        }

        if (subtitleTracks.length > 0) {
          hasControls = true;
          subtitleWrapper.style.display = '';

          const offOpt = document.createElement('option');
          offOpt.value = -1;
          offOpt.textContent = 'Vypnout';
          offOpt.selected = true;
          subtitleSelect.appendChild(offOpt);

          subtitleTracks.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.index;
            opt.textContent = t.label;
            subtitleSelect.appendChild(opt);
          });

          subtitleSelect.addEventListener('change', () => {
            selectedSubtitleIndex = parseInt(subtitleSelect.value);
            applySubtitle(selectedSubtitleIndex);
          });
        }

        if (hasControls) trackControls.style.removeProperty('display');
      })
      .catch(err => console.warn('Could not load track info:', err));

    // ── Keyboard shortcuts ──────────────────────────────────────────────────────

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'f' || e.key === 'F') {
        // Fullscreen the container so the subtitle overlay stays visible
        if (!document.fullscreenElement) {
          videoContainer.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
      if (e.key === ' ') {
        e.preventDefault();
        video.paused ? video.play() : video.pause();
      }
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        video.currentTime = Math.min(video.currentTime + 5, video.duration);
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        video.currentTime = Math.max(video.currentTime - 5, 0);
      }
    });
  </script>
</body>
</html>
