<!DOCTYPE html>
<html lang="cs" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ filename }} — Přehrávač</title>
  <link href="https://vjs.zencdn.net/8.21.1/video-js.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #000; color: #fff; min-height: 100vh; }
    .player-wrapper { max-width: 1280px; margin: 0 auto; }
    #player-container { width: 100%; background: #000; }
    /* fluid mode uses padding-top trick — cap it so very wide screens don't get huge height */
    .video-js.vjs-fluid { max-height: 75vh; }
    /* Subtitle text is rendered by Video.js in .vjs-text-track-display, which is
       inside the player container and stays visible even when controls auto-hide. */
    .video-js .vjs-text-track-display { z-index: 1; }
    /* Make subtitle text legible */
    .video-js .vjs-text-track-cue { font-size: 3em !important; }
    #hls-spinner {
      display: flex; align-items: center; justify-content: center;
      height: 200px; background: #111;
    }
    .track-section label { font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="player-wrapper px-2 px-md-4 py-3">

    <div class="d-flex align-items-center gap-3 mb-3">
      <a href="/" class="btn btn-sm btn-outline-secondary">&larr; Zpět</a>
      <h1 class="h5 mb-0 text-truncate" title="{{ filename }}">{{ filename }}</h1>
    </div>

    <div id="hls-spinner">
      <div class="text-center">
        <div class="spinner-border text-light mb-2" role="status"></div>
        <div class="text-muted small" id="hls-status-msg">Připravuji stream…</div>
      </div>
    </div>

    <div id="player-container">
      <video id="my-player"
             class="video-js vjs-default-skin vjs-big-play-centered"
             controls
             preload="none"
             style="display:none;">
      </video>
    </div>

    <div class="mt-3" id="audio-track-wrapper" style="display:none;">
      <label for="audio-track-select" class="form-label mb-1">Zvuková stopa</label>
      <select id="audio-track-select" class="form-select form-select-sm" style="min-width:180px;"></select>
      <div id="audio-status" class="text-warning small mt-1" style="display:none;">
        <span class="spinner-border spinner-border-sm me-1" role="status"></span>
        <span id="audio-status-msg"></span>
      </div>
    </div>

  </div>

  <script src="https://vjs.zencdn.net/8.21.1/video.js"></script>
  <script>
    const FILENAME      = {{ filename | tojson }};
    const SUBTITLE_BASE = {{ url_for('subtitle_track', filename=filename) | tojson }};
    const FILENAME_PATH = FILENAME.split('/').map(encodeURIComponent).join('/');

    var hlsSpinner     = document.getElementById('hls-spinner');
    var hlsStatusMsg   = document.getElementById('hls-status-msg');
    var audioWrapper   = document.getElementById('audio-track-wrapper');
    var audioSelect    = document.getElementById('audio-track-select');
    var audioStatus    = document.getElementById('audio-status');
    var audioStatusMsg = document.getElementById('audio-status-msg');

    var player         = null;
    var audioTracks    = [];
    var subtitleTracks = [];
    var selectedAudioIdx = 0;
    var selectedSubIdx   = -1;   // subtitle stream index currently showing, -1 = none
    var switchingAudio   = false;

    function hlsStatusUrl(audioIdx) {
      return '/hls-status/' + FILENAME_PATH + '?audio=' + audioIdx;
    }
    function hlsPlaylistUrl(audioIdx) {
      return '/hls/' + FILENAME_PATH + '/' + audioIdx + '/playlist.m3u8';
    }

    // ── Video.js player ────────────────────────────────────────────────────────
    function initPlayer(audioIdx, seekTo) {
      var videoEl = document.getElementById('my-player');
      videoEl.style.display = '';

      if (!player) {
        player = videojs('my-player', {
          fluid: true,
          html5: {
            vhs: {
              // On iOS use native HLS; everywhere else use VHS (MSE)
              overrideNative: !videojs.browser.IS_IOS,
              enableLowInitialPlaylist: true,
            },
          },
          playbackRates: [0.5, 1, 1.25, 1.5, 2],
          userActions: { hotkeys: true },
        });

        // Track the currently-selected subtitle so we can restore it after
        // an audio-track switch re-adds all the remote text tracks.
        player.textTracks().addEventListener('change', function() {
          var tracks = player.textTracks();
          selectedSubIdx = -1;
          for (var i = 0; i < tracks.length; i++) {
            if (tracks[i].mode === 'showing' && tracks[i].kind === 'subtitles') {
              var m = tracks[i].src && tracks[i].src.match(/[?&]index=(\d+)/);
              if (m) selectedSubIdx = parseInt(m[1], 10);
              break;
            }
          }
        });
      }

      player.src({ src: hlsPlaylistUrl(audioIdx), type: 'application/x-mpegURL' });

      // ready() fires immediately if already ready, otherwise queues callback
      player.ready(function() {
        applySubtitles();
      });

      // Seek to saved position and start playback once the source is loadable.
      player.one('canplay', function() {
        if (seekTo != null && seekTo > 0) player.currentTime(seekTo);
        player.play().catch(function() {});
      });
    }

    // ── Subtitle management ─────────────────────────────────────────────────────
    // Video.js renders subtitles inside .vjs-text-track-display, which is a div
    // inside the player container.  This div is NOT part of the controls overlay,
    // so subtitles stay visible even when the control bar auto-hides.
    // The built-in CC button in the control bar lets the user pick a track.
    function applySubtitles() {
      if (!player) return;
      // Remove previously added remote tracks
      var existing = player.remoteTextTracks();
      for (var i = existing.length - 1; i >= 0; i--) {
        player.removeRemoteTextTrack(existing[i]);
      }
      // Re-add subtitle tracks from file metadata
      subtitleTracks.forEach(function(t) {
        var trackObj = player.addRemoteTextTrack({
          kind: 'subtitles',
          label: t.label,
          src: SUBTITLE_BASE + '?index=' + t.index,
          srclang: t.lang || 'und',
          default: false,
        }, false);
        // Restore previously selected subtitle after an audio-track switch
        if (t.index === selectedSubIdx && trackObj && trackObj.track) {
          trackObj.track.mode = 'showing';
        }
      });
    }

    // ── HLS status polling ──────────────────────────────────────────────────────
    function startHls(audioIdx) {
      fetch(hlsStatusUrl(audioIdx))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.status === 'ready') {
            hlsSpinner.style.display = 'none';
            initPlayer(audioIdx, null);
          } else {
            hlsStatusMsg.textContent = 'Nahrávám video…';
            setTimeout(function() { startHls(audioIdx); }, 1000);
          }
        })
        .catch(function() { setTimeout(function() { startHls(audioIdx); }, 3000); });
    }

    // ── Audio track switching ───────────────────────────────────────────────────
    function switchAudio(newAudioIdx) {
      if (switchingAudio) return;
      switchingAudio = true;
      selectedAudioIdx = newAudioIdx;
      var savedTime = player ? player.currentTime() : 0;
      audioStatus.style.display = '';
      audioStatusMsg.textContent = 'Přepínám stopu…';
      audioSelect.disabled = true;

      function poll() {
        fetch(hlsStatusUrl(newAudioIdx))
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.status === 'ready') {
              initPlayer(newAudioIdx, savedTime);
              audioStatus.style.display = 'none';
              audioSelect.disabled = false;
              switchingAudio = false;
            } else {
              audioStatusMsg.textContent = 'Nahrávám video…';
              setTimeout(poll, 1000);
            }
          })
          .catch(function() { setTimeout(poll, 3000); });
      }
      poll();
    }

    // ── Cancel HLS on navigate away ────────────────────────────────────────────
    // Terminates any active ffmpeg process so the server isn't left encoding
    // video nobody is watching.  Uses keepalive:true so the request survives
    // the page unload; pagehide covers iOS Safari + browser-back navigation.
    var hlsCancelUrl = '/hls-cancel/' + FILENAME_PATH;
    var cancelSent = false;

    function cancelHls() {
      if (cancelSent) return;
      cancelSent = true;
      try {
        fetch(hlsCancelUrl, { method: 'POST', keepalive: true });
      } catch (e) { /* ignore */ }
    }

    // Intercept the back button so the cancel fires before navigation.
    var backBtn = document.querySelector('a[href="/"]');
    if (backBtn) {
      backBtn.addEventListener('click', function(e) {
        e.preventDefault();
        cancelHls();
        window.location.href = '/';
      });
    }

    // pagehide fires on tab close, browser-back, and iOS Safari page transitions.
    window.addEventListener('pagehide', cancelHls);

    // ── Boot ───────────────────────────────────────────────────────────────────
    fetch('/file-info/' + FILENAME_PATH)
      .then(function(r) { return r.json(); })
      .then(function(info) {
        audioTracks    = info.audio_tracks || [];
        subtitleTracks = info.subtitle_tracks || [];

        if (audioTracks.length > 1) {
          audioWrapper.style.display = '';
          selectedAudioIdx = audioTracks[0].index;
          audioTracks.forEach(function(t, i) {
            var opt = document.createElement('option');
            opt.value = t.index;
            opt.textContent = t.label;
            if (i === 0) opt.selected = true;
            audioSelect.appendChild(opt);
          });
          audioSelect.addEventListener('change', function() {
            var newIdx = parseInt(audioSelect.value, 10);
            if (newIdx !== selectedAudioIdx) switchAudio(newIdx);
          });
        }

        selectedAudioIdx = audioTracks.length > 0 ? audioTracks[0].index : 0;
        startHls(selectedAudioIdx);
      })
      .catch(function() { startHls(0); });
  </script>
</body>
</html>
